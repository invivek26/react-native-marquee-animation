appId: com.invivek26.marqueeexample
name: iOS generic marquee smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: showcase-screen
    timeout: 15000
- openLink: marquee-example://benchmark?scenario=active&count=1&durationSeconds=10
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: benchmark-screen
    timeout: 15000
- assertVisible:
    id: benchmark-marquee-0
- assertVisible:
    id: benchmark-scenario
- scrollUntilVisible:
    element:
      id: scenario-static-button
    direction: DOWN
- tapOn:
    id: scenario-static-button
- assertVisible: static
- scrollUntilVisible:
    element:
      id: scenario-updates-button
    direction: DOWN
- tapOn:
    id: scenario-updates-button
- scrollUntilVisible:
    element:
      id: update-mode-width-changing
    direction: DOWN
- tapOn:
    id: update-mode-width-changing
- scrollUntilVisible:
    element:
      id: update-count
    direction: UP
- assertVisible:
    id: update-count
- scrollUntilVisible:
    element:
      id: pause-button
    direction: DOWN
- tapOn:
    id: pause-button
- scrollUntilVisible:
    element:
      id: resume-button
    direction: DOWN
- tapOn:
    id: resume-button
