appId: com.invivek26.marqueeexample
name: iOS generic marquee smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: showcase-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: open-lab-button
    direction: DOWN
- tapOn:
    id: open-lab-button
- extendedWaitUntil:
    visible:
      id: benchmark-screen
    timeout: 15000
- assertVisible:
    id: benchmark-marquee-0
- assertVisible:
    id: benchmark-scenario
- longPressOn:
    id: benchmark-marquee-0
- swipe:
    start: 85%, 29%
    end: 15%, 29%
    duration: 150
