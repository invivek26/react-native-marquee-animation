appId: com.invivek26.marqueeexample
name: iOS production showcase
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: showcase-screen
    timeout: 15000
- assertVisible: Anything, in motion.
- assertVisible:
    id: showcase-hero-marquee
- swipe:
    start: 85%, 34%
    end: 15%, 34%
    duration: 100
- assertVisible:
    id: showcase-hero-marquee
