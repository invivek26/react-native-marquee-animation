appId: com.invivek26.marqueeexample
name: iOS marquee accessibility representation
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: showcase-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: open-static-lab-button
    direction: DOWN
- tapOn:
    id: open-static-lab-button
- extendedWaitUntil:
    visible:
      id: benchmark-screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: benchmark-marquee-0
    timeout: 15000
- assertVisible: 'Market ticker with symbols, images, charts, badges, and percentage changes'
- scrollUntilVisible:
    element:
      id: accessibility-summary
    direction: DOWN
- assertVisible:
    id: accessibility-summary
- assertVisible:
    id: reduce-motion-status
- assertVisible: system
