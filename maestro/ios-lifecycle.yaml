appId: com.invivek26.marqueeexample
name: iOS marquee lifecycle
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: showcase-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: open-lab-button
    direction: DOWN
- tapOn:
    id: open-lab-button
- extendedWaitUntil:
    visible:
      id: benchmark-screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: benchmark-marquee-0
    timeout: 15000
- pressKey: HOME
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: benchmark-marquee-0
    timeout: 15000
- scrollUntilVisible:
    element:
      id: lifecycle-status
    direction: DOWN
- assertVisible: active
- assertVisible:
    id: animation-status
